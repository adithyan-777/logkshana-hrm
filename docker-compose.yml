# Pattika stack (local-Postgres dev): Redis + Django/Gunicorn + dramatiq worker
# + dramatiq-crontab scheduler.
#
# Postgres runs on the HOST (local install), not in Docker.
# Usage:
#   cp .env.example .env   # then fill in secrets
#   docker compose up --build redis          # phase 1: broker only, Django runs locally
#   docker compose up --build                # full stack (web/worker/crontab + redis)
#
# NOTE: web/worker/crontab reach host Postgres via host.docker.internal.
#   Postgres must listen on the docker bridge: set listen_addresses='*'
#   in postgresql.conf and add a pg_hba line for 172.0.0.0/8, then restart.
#   Phase 1 (redis only + local Django) needs none of that.

name: pattika

services:
  # TEST-ONLY Postgres for seed/demo experiments (host Postgres on 5432 untouched).
  # Never auto-starts; bring up explicitly:
  #   docker compose --profile test up -d db
  # Point laptop .env at it (see .env.example test block), then:
  #   python manage.py migrate_schemas --noinput
  #   python manage.py seed_demo_data
  # Wipe the test DB (keeps all other volumes):
  #   docker compose --profile test down && docker volume rm pattika_pgdata-test
  db:
    image: postgres:18-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: pattika_test
      POSTGRES_USER: pattika
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-pattika-test-pass}
    ports:
      - "5433:5432"
    volumes:
      - pgdata-test:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pattika -d pattika_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Dramatiq broker (Redis). web enqueues from the request path; the worker
  # runs the queue; the crontab scheduler enqueues periodic tasks. Messages
  # are ephemeral; appendonly is just crash hygiene.
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    entrypoint: ["/app/entrypoint.sh"]
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "60", "--access-logfile", "-", "--error-logfile", "-", "--log-level", "info"]
    env_file:
      - .env
    environment:
      # Container DB: CONTAINER_DB_HOST wins if set, else DB_HOST, else host-gateway.
      # Laptop .env: DB_HOST=localhost (host-side) + CONTAINER_DB_HOST=host.docker.internal.
      # Server .env: DB_HOST=<rds-endpoint> alone is enough.
      DB_HOST: ${CONTAINER_DB_HOST:-${DB_HOST:-host.docker.internal}}
      DB_PORT: ${DB_PORT:-5432}
      # Dramatiq Redis broker (web enqueues from the request path).
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      DEBUG: ${DEBUG:-False}
      SECURE_COOKIES: ${SECURE_COOKIES:-False}
      RUN_MIGRATIONS: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Any HTTP response (even 404 before tenants exist) means Django is
      # answering; only connection failure is unhealthy.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8000/admin/login/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Dramatiq worker: consumes the broker queue. Scaling replicas is safe —
  # messages are claimed via Redis; scale via WORKER_PROCESSES/THREADS too.
  worker:
    build: .
    entrypoint: ["/app/entrypoint.sh"]
    command: ["dramatiq", "config.dramatiq", "--processes", "${WORKER_PROCESSES:-1}", "--threads", "${WORKER_THREADS:-4}"]
    env_file:
      - .env
    environment:
      # Container DB: CONTAINER_DB_HOST wins if set, else DB_HOST, else host-gateway.
      # Laptop .env: DB_HOST=localhost (host-side) + CONTAINER_DB_HOST=host.docker.internal.
      # Server .env: DB_HOST=<rds-endpoint> alone is enough.
      DB_HOST: ${CONTAINER_DB_HOST:-${DB_HOST:-host.docker.internal}}
      DB_PORT: ${DB_PORT:-5432}
      # Dramatiq Redis broker.
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      DEBUG: ${DEBUG:-False}
      WAIT_FOR_TABLES: "companies_company"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  # dramatiq-crontab scheduler: enqueues periodic (cron) actors to the
  # broker. Runs the tasks' enqueue side only — the worker executes them.
  # SINGLE instance: the Redis lock guards against accidental doubles.
  crontab:
    build: .
    entrypoint: ["/app/entrypoint.sh"]
    # --no-heartbeat: dramatiq-crontab's built-in heartbeat actor is imported
    # only in the scheduler process, so workers never see its actor definition
    # and DLQ one "undefined actor 'heartbeat'" message per minute forever.
    command: ["python", "manage.py", "crontab", "--no-heartbeat"]
    env_file:
      - .env
    environment:
      DB_HOST: ${CONTAINER_DB_HOST:-${DB_HOST:-host.docker.internal}}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      DEBUG: ${DEBUG:-False}
      WAIT_FOR_TABLES: "companies_company"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    ports:
      # Host apache2 already owns :80, so default to :8080 locally.
      # Prod (no host web server): NGINX_PORT=80 NGINX_SSL_PORT=443
      - "${NGINX_PORT:-8080}:80"
      - "${NGINX_SSL_PORT:-8443}:443"
    volumes:
      - staticfiles:/app/staticfiles:ro
      # Per-app routing: drop another <app>.conf in nginx/conf.d/
      # with its own server_name + proxy_pass to add an app.
      # NOTE: pattika-ssl.conf.example is ignored by nginx (*.conf only).
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # TLS cert files (Let's Encrypt volumes, or paste Cloudflare Origin
      # Certificate + key as nginx/certs/origin.pem + origin.key).
      # nginx/certs/ is git-ignored — secrets never get committed.
      - ./nginx/certs:/etc/nginx/certs:ro
      - certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      - default
      - proxy
    depends_on:
      web:
        condition: service_started
    healthcheck:
      # /healthz is answered directly by nginx (see nginx/conf.d), so the
      # marker never depends on the HTTPS redirect, TLS certs, vhost
      # matching, or Django being up.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Alloy: ships web/worker/crontab/nginx container logs + host /var/log to
  # Grafana Cloud Loki (basic_auth from env) or, when LOKI_DOCS_URL is set,
  # to the docs server (no auth). Secrets from .env (git-ignored).
  # Start it explicitly with `docker compose --profile logging up -d alloy`.
  alloy:
    image: grafana/alloy:v1.7.4
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/tmp/alloy-data"]
    environment:
      LOKI_URL: ${LOKI_URL:-}
      LOKI_USERNAME: ${LOKI_USERNAME:-}
      LOKI_PASSWORD: ${LOKI_PASSWORD:-}
      LOKI_DOCS_URL: ${LOKI_DOCS_URL:-}
      ALLOY_ENV: ${ALLOY_ENV:-prod}
    volumes:
      - ./docker/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      - alloy-positions:/tmp/alloy-data
    depends_on:
      web:
        condition: service_started
    profiles: ["logging"]
    restart: unless-stopped

  # One-shot Let's Encrypt client. Only run manually, never `up` it:
  #   docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
  #     -d pattika.example.com --email you@example.com --agree-tos --no-eff-email
  # Renewal (cron twice daily):
  #   docker compose run --rm certbot renew && docker compose exec nginx nginx -s reload
  certbot:
    image: certbot/certbot:v4.2.0
    volumes:
      - certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - proxy
    entrypoint: ["certbot"]
    profiles: ["tools"]

volumes:
  redisdata:
  staticfiles:
  certs:
  certbot-www:
  pgdata-test:
  alloy-positions:

# Shared edge network: attach any other app's web service here and add
# an nginx/conf.d/<app>.conf server block to route it by domain.
# Create it once per host before first `up`:
#   docker network create proxy-net
networks:
  proxy:
    name: proxy-net
    external: true



