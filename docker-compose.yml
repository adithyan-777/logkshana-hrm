# Pattika stack: Postgres + Redis + Django/Gunicorn + Celery worker + Celery beat.
#
# Usage:
#   cp .env.example .env   # then fill in secrets
#   docker compose up --build
#
# Beat uses the DB scheduler (django_celery_beat), so periodic tasks are
# managed via Django admin or:
#   docker compose exec web python manage.py seed_device_attendance_sync_schedule
#
# WARNING: never scale beat past 1 replica (duplicate scheduled runs).

name: pattika

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-pattika}
      POSTGRES_USER: ${DB_USER:-pattika}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      # PG18+ requires the mount at /var/lib/postgresql (it manages a
      # version-specific subdirectory itself for pg_upgrade compatibility).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pattika} -d ${DB_NAME:-pattika}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    entrypoint: ["/app/entrypoint.sh"]
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "60"]
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      DEBUG: ${DEBUG:-False}
      RUN_MIGRATIONS: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Any HTTP response (even 404 before tenants exist) means Django is
      # answering; only connection failure is unhealthy.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8000/admin/login/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    entrypoint: ["/app/entrypoint.sh"]
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      DEBUG: ${DEBUG:-False}
      WAIT_FOR_TABLES: "django_celery_beat_periodictask,companies_company"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  beat:
    build: .
    entrypoint: ["/app/entrypoint.sh"]
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      DEBUG: ${DEBUG:-False}
      WAIT_FOR_TABLES: "django_celery_beat_periodictask,companies_company"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped
    # NEVER: docker compose up --scale beat=2 (duplicate periodic runs)

volumes:
  pgdata:
  redisdata:
