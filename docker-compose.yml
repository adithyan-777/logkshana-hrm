# Pattika stack: Redis + Django/Gunicorn + django-q2 cluster.
#
# Local Docker Postgres (avoids a host install; published on :5433):
#   docker compose --profile local-db up -d postgres
# Point .env at it (see .env.example docker-local block), then:
#   uv run manage.py migrate
#
# Or use host/RDS Postgres on :5432 and skip the postgres service.
# Usage:
#   cp .env.example .env   # then fill in secrets
#   docker compose up --build redis          # phase 1: broker only, Django runs locally
#   docker compose up --build                # full stack (web/qcluster + redis)
#
# django-q2 schedules live in the public schema; register them once per deploy:
#   docker compose exec web python manage.py ensure_q2_schedules
#   docker compose exec web python manage.py ensure_device_sync_schedule
#
# WARNING: never scale qcluster past 1 replica (duplicate task pickup).
# Scale via Q2_WORKERS instead.
#
# NOTE: web/qcluster reach host Postgres via host.docker.internal.
#   Postgres must listen on the docker bridge: set listen_addresses='*'
#   in postgresql.conf and add a pg_hba line for 172.0.0.0/8, then restart.
#   Phase 1 (redis only + local Django) needs none of that.

name: pattika

services:
  # Local-dev Postgres. Never auto-starts with the default stack (RDS/host
  # Postgres stays the server default). Bring up explicitly:
  #   docker compose --profile local-db up -d postgres
  # Host port 5433 so a local Postgres install on 5432 is left alone.
  # Containers on the compose network still reach it as postgres:5432.
  postgres:
    image: postgres:18-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: ${DB_NAME:-pattika}
      POSTGRES_USER: ${DB_USER:-pattika}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pattika}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # TEST-ONLY Postgres for seed/demo experiments (host Postgres on 5432 untouched).
  # Never auto-starts; bring up explicitly:
  #   docker compose --profile test up -d db
  # Point laptop .env at it (see .env.example test block), then:
  #   python manage.py migrate_schemas --noinput
  #   python manage.py seed_demo_data
  # Wipe the test DB (keeps all other volumes):
  #   docker compose --profile test down && docker volume rm pattika_pgdata-test
  db:
    image: postgres:18-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: pattika_test
      POSTGRES_USER: pattika
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-pattika-test-pass}
    ports:
      - "5433:5432"
    volumes:
      - pgdata-test:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pattika -d pattika_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # q2 broker (Redis). web enqueues from the request path; qcluster works
  # the queue. Tasks are ephemeral; appendonly is just crash hygiene.
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    entrypoint: ["/app/entrypoint.sh"]
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "60"]
    env_file:
      - .env
    environment:
      # Container DB: CONTAINER_DB_* wins if set, else host DB_*, else host-gateway:5432.
      # Laptop docker-local: DB_HOST=localhost DB_PORT=5433 + CONTAINER_DB_HOST=postgres.
      # Server .env: DB_HOST=<rds-endpoint> alone is enough.
      DB_HOST: ${CONTAINER_DB_HOST:-${DB_HOST:-host.docker.internal}}
      DB_PORT: ${CONTAINER_DB_PORT:-${DB_PORT:-5432}}
      # q2 Redis broker (web enqueues from the request path).
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      DEBUG: ${DEBUG:-False}
      SECURE_COOKIES: ${SECURE_COOKIES:-False}
      RUN_MIGRATIONS: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Any HTTP response (even 404 before tenants exist) means Django is
      # answering; only connection failure is unhealthy.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8000/admin/login/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qcluster:
    build: .
    entrypoint: ["/app/entrypoint.sh"]
    command: ["python", "manage.py", "qcluster"]
    env_file:
      - .env
    environment:
      # Container DB: CONTAINER_DB_* wins if set, else host DB_*, else host-gateway:5432.
      # Laptop docker-local: DB_HOST=localhost DB_PORT=5433 + CONTAINER_DB_HOST=postgres.
      # Server .env: DB_HOST=<rds-endpoint> alone is enough.
      DB_HOST: ${CONTAINER_DB_HOST:-${DB_HOST:-host.docker.internal}}
      DB_PORT: ${CONTAINER_DB_PORT:-${DB_PORT:-5432}}
      # q2 Redis broker.
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      DEBUG: ${DEBUG:-False}
      Q2_WORKERS: ${Q2_WORKERS:-2}
      WAIT_FOR_TABLES: "django_q_task,companies_company"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped
    # NEVER: docker compose up --scale qcluster=2 (duplicate task pickup).
    # Scale via Q2_WORKERS instead.

  nginx:
    image: nginx:1.29-alpine
    ports:
      # Host apache2 already owns :80, so default to :8080 locally.
      # Prod (no host web server): NGINX_PORT=80 NGINX_SSL_PORT=443
      - "${NGINX_PORT:-8080}:80"
      - "${NGINX_SSL_PORT:-8443}:443"
    volumes:
      - staticfiles:/app/staticfiles:ro
      # Per-app routing: drop another <app>.conf in nginx/conf.d/
      # with its own server_name + proxy_pass to add an app.
      # NOTE: pattika-ssl.conf.example is ignored by nginx (*.conf only).
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # TLS cert files (Let's Encrypt volumes, or paste Cloudflare Origin
      # Certificate + key as nginx/certs/origin.pem + origin.key).
      # nginx/certs/ is git-ignored — secrets never get committed.
      - ./nginx/certs:/etc/nginx/certs:ro
      - certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      - default
      - proxy
    depends_on:
      web:
        condition: service_started
    healthcheck:
      # Any HTTP response (even 301/404) means nginx is answering; only
      # connection failure is unhealthy. Tries plain HTTP first (local
      # dev), then HTTPS with cert check off (prod origin cert isn't
      # publicly trusted). wget exits 8 on HTTP error statuses — that
      # still proves nginx responded.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/admin/login/ 2>/dev/null; code=$$?; if [ $$code -eq 0 ] || [ $$code -eq 8 ]; then exit 0; fi; wget -q --no-check-certificate -O /dev/null https://localhost/admin/login/ 2>/dev/null; code=$$?; [ $$code -eq 0 ] || [ $$code -eq 8 ]"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot Let's Encrypt client. Only run manually, never `up` it:
  #   docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
  #     -d pattika.example.com --email you@example.com --agree-tos --no-eff-email
  # Renewal (cron twice daily):
  #   docker compose run --rm certbot renew && docker compose exec nginx nginx -s reload
  certbot:
    image: certbot/certbot:v4.2.0
    volumes:
      - certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - proxy
    entrypoint: ["certbot"]
    profiles: ["tools"]

volumes:
  redisdata:
  staticfiles:
  certs:
  certbot-www:
  pgdata:
  pgdata-test:

# Shared edge network: attach any other app's web service here and add
# an nginx/conf.d/<app>.conf server block to route it by domain.
# Create it once per host before first `up`:
#   docker network create proxy-net
networks:
  proxy:
    name: proxy-net
    external: true
