# Pattika app — LOCAL DEV override (plain :80 proxy, no TLS redirect).
# Mounted by docker/local/docker-compose.yml instead of
# nginx/conf.d/pattika.conf (which is the canonical PRODUCTION file with
# the HTTP -> HTTPS redirect). Keep the proxy approach in sync with it:
# no `upstream` block — route via a variable so Docker embedded DNS
# re-resolves `web` after container recreations.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    # Catch-all: tenant subdomains (demo.localhost, …) in local dev.
    server_name _;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Let's Encrypt HTTP-01 challenge webroot (unused locally, kept for parity).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        set $django_upstream web:8000;
        proxy_pass http://$django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
