# DAS Auto Repair — autorepair.ittisalhrm.com
# Routed by pattika's shared edge nginx to the das stack's das-nginx service
# on proxy-net (alias set in das_auto_repair/docker-compose.yml).
#
# Certificate: pattika's Cloudflare Origin wildcard (*.ittisalhrm.com).
# Cloudflare terminates public TLS; this origin cert covers the subdomain.
server {
    listen 80;
    server_name autorepair.ittisalhrm.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name autorepair.ittisalhrm.com;
    # Server-scoped: pattika.conf already sets a global resolver.
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;

    location / {
        # Variable + resolver: survive das-nginx container recreations.
        set $das_edge das-nginx;
        proxy_pass http://$das_edge;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
