# Ittisal mobile shop — mshop.ittisalhrm.com and its shop subdomains
# (<branch>.<company>.mshop.ittisalhrm.com). TLS is split by DNS record:
# the root host stays proxied at Cloudflare (Origin CA cert, mshop.pem),
# shop subdomains resolve DNS-only to this nginx and get the Let's Encrypt
# wildcard certificate (certbot-dns, --cert-name mshop-shops). See
# ittisal-mshop README for the DNS layout and issuance commands.

server {
    listen 80;
    server_name mshop.ittisalhrm.com *.mshop.ittisalhrm.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # mshop.ittisalhrm.com stays proxied (orange) at Cloudflare: Universal
    # SSL answers browsers, and Cloudflare -> origin is encrypted by mshop's
    # own Origin CA certificate (nginx/certs/mshop.pem, git-ignored).
    server_name mshop.ittisalhrm.com;
    # Server-scoped: pattika.conf already sets a global resolver.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Paste target: ../pattika/nginx/certs/mshop.pem + mshop.key (git-ignored).
    ssl_certificate /etc/nginx/certs/mshop.pem;
    ssl_certificate_key /etc/nginx/certs/mshop.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;

    location / {
        # Variable + resolver: survive mshop-nginx container recreations.
        set $mshop_edge mshop-nginx;
        proxy_pass http://$mshop_edge;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}

server {
    listen 443 ssl;
    # Shop subdomains sit on grey-clouded (DNS-only) *.mshop records, so
    # browsers connect here directly and nginx presents the Let's Encrypt
    # wildcard certificate (DNS-01 via pattika's certbot-dns service,
    # --cert-name mshop-shops; full command in the compose file). One
    # wildcard SAN per company level. nginx matches this block for any
    # *.mshop host at any depth; the exact name above keeps the root on
    # the Origin certificate.
    server_name *.mshop.ittisalhrm.com;
    # Server-scoped: pattika.conf already sets a global resolver.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Issued into the certs volume by certbot-dns; issue BEFORE deploying
    # this conf, or nginx -t fails on the missing files.
    ssl_certificate /etc/letsencrypt/live/mshop-shops/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mshop-shops/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;

    location / {
        # Variable + resolver: survive mshop-nginx container recreations.
        set $mshop_edge mshop-nginx;
        proxy_pass http://$mshop_edge;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
