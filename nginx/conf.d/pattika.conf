# Pattika app. Default server: catches all hosts not claimed by other
# apps' server blocks (localhost + tenant subdomains in local dev).
# When other apps are added (otherapp.conf with their own server_name),
# nginx routes by exact domain match first, so this block keeps serving
# pattika. On prod, replace `_` with the real domains.

upstream django {
    server web:8000;
}

server {
    listen 80 default_server;
    # Catch-all: tenant subdomains vary per environment.
    server_name _;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Let's Encrypt HTTP-01 challenge webroot. Certbot writes here,
    # nginx serves it. Keep reachable over plain HTTP even after you
    # enable the HTTPS redirect (see pattika-ssl.conf.example).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
