[project]
name = "pattika"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0,<6.1",
    "django-allauth[socialaccount]>=65.19.0",
    "django-q2>=1.11.1",
    "django-tenants>=3.14.0",
    "django-waffle>=5.0.0",
    "djangorestframework>=3.18.0",
    "gunicorn>=26.2.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.2.2",
    "redis>=8.1.0",
    "reportlab>=5.0.0",
    "ruff>=0.16.2",
    "sentry-sdk>=2.68.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.1",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.ruff.lint]
extend-select = [
    "DJ",       # flake8-django
    "E",        # pycodestyle errors
    "F",        # Pyflakes
    "W",        # pycodestyle warnings
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "RUF012"]
"**/settings.py" = ["E501", "F403", "F405"]
"**/tests.py" = ["S101"]
"**/test_*.py" = ["S101"]