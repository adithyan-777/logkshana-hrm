[project]
name = "pattika"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "django>=6.0,<6.1",
    "django-allauth[socialaccount]>=65.19.0",
    "django-celery-beat==2.9.0",
    "django-celery-results>=2.6.0",
    "django-q2>=1.11.1",
    "django-tenants>=3.14.0",
    "django-waffle>=5.0.0",
    "djangorestframework>=3.18.0",
    "gunicorn>=26.2.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.2.2",
    "redis>=8.1.0",
    "reportlab>=5.0.0",
    "ruff>=0.16.2",
    "sentry-sdk>=2.68.1",
    "tenant-schemas-celery>=5.0.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.1",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings"
