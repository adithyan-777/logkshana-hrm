{% extends "standalone.html" %}
{% load i18n %}

{% block title %}{% trans "Sign Out" %}{% endblock %}

{% block content %}
<div class="login-card">
  <div class="login-card__brand">
    <span class="login-card__logo"><i class="bx bx-robot"></i></span>
    <h1 class="login-card__title">{% trans "Sign Out" %}</h1>
    <p class="login-card__subtitle">{% trans "Are you sure you want to sign out?" %}</p>
  </div>

  <form method="post" action="{% url 'account_logout' %}" class="login-card__form">
    {% csrf_token %}
    {% if redirect_field_value %}
      <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
    {% endif %}

    <div class="form-actions" style="margin-top: var(--space-3);">
      <button type="submit" class="btn btn--primary" style="width:100%; justify-content:center;">
        {% trans "Sign Out" %}
      </button>
    </div>
  </form>

  <p class="text-muted" style="margin-top: var(--space-3);">
    <a href="{% url 'dashboard' %}">{% trans "Cancel" %}</a>
  </p>
</div>
{% endblock %}
