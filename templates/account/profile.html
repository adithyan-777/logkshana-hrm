{% extends "layouts/app_shell.html" %}

{% block title %}Profile{% endblock %}
{% block page_title %}Profile{% endblock %}

{% block page_content %}
<dl class="profile-details">
    <dt>Username</dt>
    <dd>{{ user.username }}</dd>

    {% if user.email %}
    <dt>Email</dt>
    <dd>{{ user.email }}</dd>
    {% endif %}
</dl>
{% endblock %}
