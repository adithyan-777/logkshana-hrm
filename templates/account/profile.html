{% extends "base.html" %}

{% block title %}Profile{% endblock %}

{% block content %}
<h1>Profile</h1>

<dl class="profile-details">
    <dt>Username</dt>
    <dd>{{ user.username }}</dd>

    {% if user.email %}
    <dt>Email</dt>
    <dd>{{ user.email }}</dd>
    {% endif %}
</dl>

<nav class="page-nav">
    <a href="{% url 'employee_list' %}">Employees</a>
    <a href="{% url 'account_logout' %}">Log out</a>
</nav>
{% endblock %}
