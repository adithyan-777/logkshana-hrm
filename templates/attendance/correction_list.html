{% extends "layouts/app_shell.html" %}

{% block title %}Attendance Corrections{% endblock %}

{% block page_content %}
{% include "partials/tabs_attendance.html" %}

<div class="toolbar">
  <label class="sr-only" for="correction-search">Search</label>
  <input
    id="correction-search"
    class="search-input toolbar__search"
    type="search"
    name="q"
    value="{{ search }}"
    placeholder="Employee, reason, or status..."
    hx-get="{% url 'attendance_correction_list' %}"
    hx-target="#correction-list"
    hx-trigger="keyup changed delay:300ms, search"
    hx-push-url="true"
  >
</div>

<div class="card card--table">
  <div class="card__body">
    <div
      id="correction-list"
      class="data-table-wrap"
      hx-get="{% url 'attendance_correction_list' %}{% if search %}?q={{ search|urlencode }}{% endif %}"
      hx-trigger="attendanceCorrectionCreated from:body"
      hx-target="this"
      hx-swap="innerHTML"
    >
      {% include "attendance/partials/correction_table.html" %}
    </div>
  </div>
</div>
{% endblock %}
