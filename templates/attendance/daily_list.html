{% extends "layouts/app_shell.html" %}

{% block title %}Daily Attendance{% endblock %}

{% block page_content %}
{% include "partials/tabs_attendance.html" %}

<div class="toolbar">
  <label class="sr-only" for="daily-search">Search</label>
  <input
    id="daily-search"
    class="search-input toolbar__search"
    type="search"
    name="q"
    value="{{ search }}"
    placeholder="Employee or status..."
    hx-get="{% url 'daily_attendance_list' %}"
    hx-target="#daily-list"
    hx-trigger="keyup changed delay:300ms, search"
    hx-push-url="true"
  >
</div>

<div class="card card--table">
  <div class="card__body">
    <div
      id="daily-list"
      class="data-table-wrap"
      hx-get="{% url 'daily_attendance_list' %}{% if search %}?q={{ search|urlencode }}{% endif %}"
      hx-trigger="dailyAttendanceCreated from:body"
      hx-swap="innerHTML"
    >
      {% include "attendance/partials/daily_table.html" %}
    </div>
  </div>
</div>
{% endblock %}
