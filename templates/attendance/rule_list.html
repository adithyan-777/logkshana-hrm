{% extends "layouts/app_shell.html" %}

{% block title %}Attendance Rules{% endblock %}
{% block page_title %}Attendance Rules{% endblock %}

{% block page_content %}
<label for="rule-search">Search</label>
<input
    id="rule-search"
    class="search-input"
    type="search"
    name="q"
    value="{{ search }}"
    placeholder="Rule name..."
    hx-get="{% url 'attendance_rule_list' %}"
    hx-target="#rule-list"
    hx-trigger="keyup changed delay:300ms, search"
    hx-push-url="true"
>

<div
    id="rule-list"
    hx-get="{% url 'attendance_rule_list' %}{% if search %}?q={{ search|urlencode }}{% endif %}"
    hx-trigger="attendanceRuleCreated from:body"
    hx-swap="innerHTML"
>
    {% include "attendance/partials/rule_table.html" %}
</div>
{% endblock %}
