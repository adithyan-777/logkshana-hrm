{% extends "layouts/app_shell.html" %}

{% block title %}Attendance Rules{% endblock %}

{% block page_content %}
{% include "partials/tabs_attendance.html" %}

<div class="toolbar">
  <label class="sr-only" for="rule-search">Search</label>
  <input
    id="rule-search"
    class="search-input toolbar__search"
    type="search"
    name="q"
    value="{{ search }}"
    placeholder="Rule name..."
    hx-get="{% url 'attendance_rule_list' %}"
    hx-target="#rule-list"
    hx-trigger="keyup changed delay:300ms, search"
    hx-push-url="true"
  >
</div>

<div class="card card--table">
  <div class="card__body">
    <div
      id="rule-list"
      class="data-table-wrap"
      hx-get="{% url 'attendance_rule_list' %}{% if search %}?q={{ search|urlencode }}{% endif %}"
      hx-trigger="attendanceRuleCreated from:body"
      hx-target="this"
      hx-swap="innerHTML"
    >
      {% include "attendance/partials/rule_table.html" %}
    </div>
  </div>
</div>
{% endblock %}
