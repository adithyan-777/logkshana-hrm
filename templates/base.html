<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Logkshana{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
        .page-nav { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
        .page-nav a { color: #1d4ed8; text-decoration: none; }
        .page-nav a:hover { text-decoration: underline; }
        #employee-search { width: 100%; max-width: 320px; padding: 0.5rem; margin-bottom: 1rem; box-sizing: border-box; }
        .search-input { width: 100%; max-width: 320px; padding: 0.5rem; margin-bottom: 1rem; box-sizing: border-box; }
        .employee-table, .data-table { width: 100%; border-collapse: collapse; }
        .employee-table th, .employee-table td, .data-table th, .data-table td { padding: 0.625rem 0.75rem; text-align: left; border-bottom: 1px solid #e5e7eb; }
        .employee-table th, .data-table th { font-size: 0.875rem; color: #4b5563; }
        .badge { display: inline-block; padding: 0.125rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 500; }
        .badge.active { background: #dcfce7; color: #166534; }
        .badge.inactive { background: #f3f4f6; color: #6b7280; }
        .badge.status-draft { background: #f3f4f6; color: #4b5563; }
        .badge.status-pending { background: #fef3c7; color: #92400e; }
        .badge.status-approved { background: #dcfce7; color: #166534; }
        .badge.status-rejected { background: #fee2e2; color: #991b1b; }
        .badge.status-cancelled { background: #f3f4f6; color: #6b7280; }
        .badge.status-present { background: #dcfce7; color: #166534; }
        .badge.status-absent { background: #fee2e2; color: #991b1b; }
        .badge.status-late { background: #fef3c7; color: #92400e; }
        .badge.status-incomplete { background: #ffedd5; color: #9a3412; }
        .badge.status-leave { background: #dbeafe; color: #1e40af; }
        .page-nav { flex-wrap: wrap; }
        .empty-state { color: #6b7280; }
        .message a { margin-left: 0.5rem; }
        .field { margin-bottom: 1rem; }
        .field label { display: block; font-weight: 500; margin-bottom: 0.25rem; }
        .field input, .field select, .field textarea { width: 100%; padding: 0.5rem; box-sizing: border-box; }
        .field.checkbox { display: flex; align-items: center; gap: 0.5rem; }
        .field.checkbox input { width: auto; }
        .error { color: #b91c1c; font-size: 0.875rem; }
        .message { padding: 0.75rem 1rem; border-radius: 0.375rem; margin-bottom: 1rem; }
        .message.success { background: #dcfce7; color: #166534; }
        .message.error { background: #fee2e2; color: #991b1b; }
        button { padding: 0.5rem 1rem; cursor: pointer; }
        .form-section { border: 1px solid #e5e7eb; border-radius: 0.375rem; padding: 1rem; margin-bottom: 1.5rem; }
        .form-section legend { font-weight: 600; padding: 0 0.25rem; }
        .field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
        .help-text { color: #6b7280; font-size: 0.875rem; margin-top: 0; }
        .formset-table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; }
        .formset-table th, .formset-table td { padding: 0.5rem; text-align: left; border-bottom: 1px solid #e5e7eb; }
        .profile-details { margin: 1.5rem 0; }
        .profile-details dt { font-size: 0.875rem; color: #4b5563; margin-bottom: 0.125rem; }
        .profile-details dd { margin: 0 0 1rem; font-weight: 500; }
    </style>
</head>
<body>
    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
