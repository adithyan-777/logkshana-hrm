<div class="alert alert--success invite-box">
    <p><strong>{{ employee.first_name }} {{ employee.last_name }}</strong> was added.</p>
    <p class="text-muted">Share this link with them to set their password:</p>
    <p><code>{{ invite_link }}</code></p>
    <button
      type="button"
      onclick="navigator.clipboard.writeText('{{ invite_link }}')"
    >
      Copy link
    </button>
    <a href="{% url 'employee_add' %}" hx-get="{% url 'employee_add' %}" hx-target="this" hx-swap="outerHTML">
      Add another employee
    </a>
</div>
