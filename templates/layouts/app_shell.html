{% extends "base.html" %}

{% block content %}
{% if messages %}
  {% for message in messages %}
    <div class="alert {% if 'error' in message.tags %}alert--error{% elif 'success' in message.tags %}alert--success{% else %}alert--info{% endif %}">
      {{ message }}
    </div>
  {% endfor %}
{% endif %}

{% block page_head %}
{% include "partials/page_head.html#page_head" %}
{% endblock %}

{% block page_content %}{% endblock %}
{% endblock %}
