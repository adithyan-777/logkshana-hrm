{% extends "layouts/app_shell.html" %}

{% block title %}Holidays{% endblock %}

{% block page_content %}
{% include "partials/tabs_leave.html" %}

<div class="toolbar">
  <label class="sr-only" for="holiday-search">Search</label>
  <input
    id="holiday-search"
    class="search-input toolbar__search"
    type="search"
    name="q"
    value="{{ search }}"
    placeholder="Name or description..."
    hx-get="{% url 'holiday_list' %}"
    hx-target="#holiday-list"
    hx-trigger="keyup changed delay:300ms, search"
    hx-push-url="true"
  >
</div>

<div class="card card--table">
  <div class="card__body">
    <div
      id="holiday-list"
      class="data-table-wrap"
      hx-get="{% url 'holiday_list' %}{% if search %}?q={{ search|urlencode }}{% endif %}"
      hx-trigger="holidayCreated from:body"
      hx-swap="innerHTML"
    >
      {% include "leave/partials/holiday_table.html" %}
    </div>
  </div>
</div>
{% endblock %}
