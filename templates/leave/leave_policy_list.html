{% extends "layouts/app_shell.html" %}

{% block title %}Leave Policies{% endblock %}

{% block page_content %}
{% include "partials/tabs_leave.html" %}

<div class="toolbar">
  <label class="sr-only" for="leave-policy-search">Search</label>
  <input
    id="leave-policy-search"
    class="search-input toolbar__search"
    type="search"
    name="q"
    value="{{ search }}"
    placeholder="Policy or leave type..."
    hx-get="{% url 'leave_policy_list' %}"
    hx-target="#leave-policy-list"
    hx-trigger="keyup changed delay:300ms, search"
    hx-push-url="true"
  >
</div>

<div class="card card--table">
  <div class="card__body">
    <div
      id="leave-policy-list"
      class="data-table-wrap"
      hx-get="{% url 'leave_policy_list' %}{% if search %}?q={{ search|urlencode }}{% endif %}"
      hx-trigger="leavePolicyCreated from:body"
      hx-target="this"
      hx-swap="innerHTML"
    >
      {% include "leave/partials/leave_policy_table.html" %}
    </div>
  </div>
</div>
{% endblock %}
