{% extends "layouts/app_shell.html" %}

{% block title %}Leave Types{% endblock %}
{% block page_title %}Leave Types{% endblock %}

{% block page_content %}
<label for="leave-type-search">Search</label>
<input
    id="leave-type-search"
    class="search-input"
    type="search"
    name="q"
    value="{{ search }}"
    placeholder="Name or code..."
    hx-get="{% url 'leave_type_list' %}"
    hx-target="#leave-type-list"
    hx-trigger="keyup changed delay:300ms, search"
    hx-push-url="true"
>

<div
    id="leave-type-list"
    hx-get="{% url 'leave_type_list' %}{% if search %}?q={{ search|urlencode }}{% endif %}"
    hx-trigger="leaveTypeCreated from:body"
    hx-swap="innerHTML"
>
    {% include "leave/partials/leave_type_table.html" %}
</div>
{% endblock %}
