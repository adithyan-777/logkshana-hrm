{% if breadcrumbs %}
<nav class="breadcrumbs" aria-label="Breadcrumb">
    {% for label, url_name in breadcrumbs %}
        {% if url_name %}
            <a href="{% url url_name %}">{{ label }}</a>
        {% else %}
            <span aria-current="page">{{ label }}</span>
        {% endif %}
        {% if not forloop.last %}<span class="breadcrumb-sep">/</span>{% endif %}
    {% endfor %}
</nav>
{% endif %}
