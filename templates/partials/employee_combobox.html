<div class="combo" id="employee-combo">
  <label class="form-label" for="employee-search">Employee *</label>
  {{ form.employee }}
  <input
    type="search"
    id="employee-search"
    name="employee_q"
    class="form-input"
    placeholder="Type at least 2 letters to search…"
    autocomplete="off"
    value="{{ form.employee_q.value|default:'' }}"
    hx-get="{% url 'employee_options' %}"
    hx-target="#employee-results"
    hx-swap="innerHTML"
    hx-push-url="false"
    hx-trigger="keyup[event.target.value.trim().length >= 2] delay:300ms, search[event.target.value.trim().length >= 2]"
    oninput="employeeSearchChanged(this)"
    onsearch="employeeSearchCleared(this)"
  >
  <div id="employee-selected" class="combo-selected{% if not selected_label %} combo-selected--empty{% endif %}">
    {% if selected_label %}
    <span class="combo-chip"><span>{{ selected_label }}</span><button type="button" class="combo-chip__remove" title="Clear" aria-label="Clear selected employee" onclick="clearEmployeeOption()">×</button></span>
    {% else %}
    <span class="combo-hint">No employee selected.</span>
    {% endif %}
  </div>
  <div id="employee-results" class="combo-results" aria-live="polite"></div>
  {% if form.employee.errors %}<span class="error">{{ form.employee.errors }}</span>{% endif %}
</div>
<script>
(function () {
  if (window.selectEmployeeOption && window.employeeSearchChanged) return;
  function comboEls() {
    return {
      hidden: document.querySelector("#employee-combo input[type=hidden][name=employee]"),
      search: document.getElementById("employee-search"),
      box: document.getElementById("employee-selected"),
      results: document.getElementById("employee-results")
    };
  }
  function renderSelected(box, label) {
    if (!box) return;
    if (label) {
      box.classList.remove("combo-selected--empty");
      box.innerHTML = "";
      var chip = document.createElement("span");
      chip.className = "combo-chip";
      var name = document.createElement("span");
      name.textContent = label;
      chip.appendChild(name);
      var clear = document.createElement("button");
      clear.type = "button";
      clear.className = "combo-chip__remove";
      clear.textContent = "×";
      clear.title = "Clear";
      clear.setAttribute("aria-label", "Clear selected employee");
      clear.setAttribute("onclick", "clearEmployeeOption()");
      chip.appendChild(clear);
      box.appendChild(chip);
    } else {
      box.classList.add("combo-selected--empty");
      box.innerHTML = '<span class="combo-hint">No employee selected.</span>';
    }
  }
  window.selectEmployeeOption = function (btn) {
    var id = btn.getAttribute("data-id");
    var label = btn.getAttribute("data-label");
    var els = comboEls();
    if (els.hidden) els.hidden.value = id;
    if (els.search) els.search.value = label;
    renderSelected(els.box, label);
    if (els.results) els.results.innerHTML = "";
  };
  window.clearEmployeeOption = function () {
    var els = comboEls();
    if (els.hidden) els.hidden.value = "";
    if (els.search) { els.search.value = ""; els.search.focus(); }
    renderSelected(els.box, "");
    if (els.results) els.results.innerHTML = "";
  };
  window.employeeSearchChanged = function (input) {
    var els = comboEls();
    if (els.hidden) els.hidden.value = "";
    renderSelected(els.box, "");
    var val = (input.value || "").trim();
    if (val.length < 2 && els.results) els.results.innerHTML = "";
  };
  window.employeeSearchCleared = function (input) {
    if (input.value) return;
    var els = comboEls();
    if (els.hidden) els.hidden.value = "";
    renderSelected(els.box, "");
    if (els.results) els.results.innerHTML = "";
  };
})();
</script>
<style>
.combo { position: relative; }
.combo-chip { display: inline-flex; align-items: center; gap: .45rem; padding: .2rem .25rem .2rem .65rem; border: 1px solid var(--border); border-radius: 999px; background: var(--bg-muted); color: var(--text); font-size: .82rem; line-height: 1.4; }
.combo-chip__remove { display: inline-flex; align-items: center; justify-content: center; width: 1.25rem; height: 1.25rem; padding: 0; border: none; border-radius: 50%; background: transparent; color: var(--text-muted); font-size: 1rem; line-height: 1; cursor: pointer; }
.combo-chip__remove:hover { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
.combo-results { margin-top: .5rem; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: .5rem; padding: .5rem; box-shadow: 0 8px 24px rgba(0,0,0,.08); color: var(--text); }
.combo-results:empty { display: none; }
.combo-list { display: flex; flex-direction: column; gap: .25rem; max-height: 220px; overflow-y: auto; background: transparent; }
.combo-option { display: flex; justify-content: space-between; align-items: center; gap: .5rem; padding: .5rem .6rem; border: 1px solid var(--border); border-radius: .5rem; background: var(--bg-elevated); color: var(--text); cursor: pointer; text-align: left; width: 100%; }
.combo-option:hover { border-color: var(--accent); background: var(--hover-subtle); }
.combo-option__name { font-weight: 600; color: var(--text); }
.combo-option__meta { font-size: .8rem; color: var(--text-muted); }
.combo-hint { font-size: .85rem; color: var(--text-muted); margin: .25rem 0; }
.combo-empty { font-size: .9rem; color: var(--danger); }
.combo-selected { margin-top: .4rem; font-size: .9rem; }
</style>
