<div class="empty-stage">
  <div class="empty-stage__icon"><i class="bx bx-folder-open"></i></div>
  <div class="empty-stage__title">{{ title|default:"No data yet" }}</div>
  <p class="empty-stage__text">{{ text|default:"Get started by creating your first record." }}</p>
  {% if action_url %}
  <div class="mt-3">
    <a href="{{ action_url }}" class="btn btn--primary">{{ action_label|default:"Create" }}</a>
  </div>
  {% endif %}
</div>
