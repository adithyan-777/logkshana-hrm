{% partialdef page_head inline %}
{# Shared page heading. Page actions render at the end of each list toolbar. #}
<div class="page-head">
  <div class="page-head__copy">
    <h1 class="page-head__title">{{ page_heading|default:"Dashboard" }}</h1>
    {% if page_subtitle %}
    <p class="page-head__subtitle">{{ page_subtitle }}</p>
    {% endif %}
  </div>
</div>
{% endpartialdef page_head %}
