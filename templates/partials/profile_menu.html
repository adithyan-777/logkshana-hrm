{% load avatar %}
{% partialdef profile_menu inline %}
<div
  class="profile-menu profile-menu--topbar"
  :class="{ 'is-open': $store.ui.menu === 'profile' }"
  @click.outside="$store.ui.menu === 'profile' && $store.ui.closeMenus()"
>
  <button
    type="button"
    class="profile profile--compact"
    aria-label="Account menu"
    aria-haspopup="menu"
    :aria-expanded="$store.ui.menu === 'profile'"
    @click="$store.ui.toggleMenu('profile')"
  >
    <span class="profile__avatar-wrap">
      {% avatar user size="md" %}
      <span class="profile__status" aria-hidden="true"></span>
    </span>
  </button>
  <div class="profile-menu__panel" role="menu" x-cloak>
    <div class="profile-menu__head">
      <span class="profile__name">{{ user.get_username }}</span>
      <span class="profile-menu__email">{{ user.email|default:"—" }}</span>
    </div>
    <hr class="profile-menu__divider">
    <a href="{% url 'account_profile' %}" class="profile-menu__item" role="menuitem" @click="$store.ui.closeMenus()">
      <i class="bx bx-user admin-icon admin-icon--18"></i>
      Profile
    </a>
    <hr class="profile-menu__divider">
    <a href="{% url 'account_logout' %}" class="profile-menu__item profile-menu__item--danger" role="menuitem" hx-boost="false">
      <i class="bx bx-arrow-from-right admin-icon admin-icon--18"></i>
      Log out
    </a>
  </div>
</div>
{% endpartialdef profile_menu %}
