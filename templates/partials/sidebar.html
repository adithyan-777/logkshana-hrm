<aside class="sidebar" id="sidebar" aria-label="Primary">
  <div class="sidebar__top">
    <a href="{% url 'dashboard' %}" class="brand-mark" title="Logkshana" aria-label="Logkshana">
      <span class="brand-mark__icon brand-mark__logo">
        <i class="bx bx-robot admin-icon admin-icon--20"></i>
      </span>
      <span class="brand-mark__icon brand-mark__toggle">
        <i class="bx bx-sidebar admin-icon admin-icon--18"></i>
      </span>
    </a>
    <label for="sidebar-collapsed" class="brand-mark__expand-hit" aria-label="Expand sidebar"></label>
    <label for="sidebar-collapsed" class="sidebar__collapse-btn" aria-label="Collapse sidebar">
      <i class="bx bx-sidebar admin-icon admin-icon--18"></i>
    </label>
    <label for="sidebar-mobile" class="sidebar__mobile-close" aria-label="Close menu">
      <i class="bx bx-x admin-icon admin-icon--18"></i>
    </label>
  </div>

  <div class="sidebar__body">
    <div class="sidebar-search" role="search" aria-label="Search">
      <i class="bx bx-search admin-icon admin-icon--18"></i>
      <span class="sidebar-search__text">Search…</span>
      <kbd class="sidebar-search__kbd">⌘ K</kbd>
    </div>

    <nav class="quick-actions" aria-label="Logkshana">
      <a href="{% url 'dashboard' %}"
         class="quick-action {% if request.resolver_match.url_name == 'dashboard' %}is-active{% endif %}">
        <span class="quick-action__icon"><i class="bx bx-grid admin-icon admin-icon--20"></i></span>
        <span class="quick-action__label">Dashboard</span>
      </a>
      <a href="{% url 'employee_list' %}"
         class="quick-action {% if request.path|slice:':11' == '/employees/' %}is-active{% endif %}">
        <span class="quick-action__icon"><i class="bx bx-user admin-icon admin-icon--20"></i></span>
        <span class="quick-action__label">Employees</span>
      </a>
      <a href="{% url 'attendance_transaction_list' %}"
         class="quick-action {% if request.path|slice:':12' == '/attendance/' %}is-active{% endif %}">
        <span class="quick-action__icon"><i class="bx bx-calendar-check admin-icon admin-icon--20"></i></span>
        <span class="quick-action__label">Attendance</span>
      </a>
      <a href="{% url 'leave_request_list' %}"
         class="quick-action {% if request.path|slice:':7' == '/leave/' %}is-active{% endif %}">
        <span class="quick-action__icon"><i class="bx bx-calendar-minus admin-icon admin-icon--20"></i></span>
        <span class="quick-action__label">Leave</span>
      </a>
      <a href="{% url 'timetable_list' %}"
         class="quick-action {% if request.path|slice:':10' == '/schedule/' %}is-active{% endif %}">
        <span class="quick-action__icon"><i class="bx bx-clock-5 admin-icon admin-icon--20"></i></span>
        <span class="quick-action__label">Schedule</span>
      </a>
      <a href="{% url 'report_hub' %}"
         class="quick-action {% if request.path|slice:':9' == '/reports/' %}is-active{% endif %}">
        <span class="quick-action__icon"><i class="bx bx-chart-bar-big-columns admin-icon admin-icon--20"></i></span>
        <span class="quick-action__label">Reports</span>
      </a>
    </nav>
  </div>
</aside>
