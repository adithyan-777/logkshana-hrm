{% partialdef tabs_schedule inline %}
<div class="tabs" role="tablist" aria-label="Schedule sections">
  <a href="{% url 'timetable_list' %}"
     class="tab {% if request.resolver_match.url_name == 'timetable_list' or request.resolver_match.url_name == 'timetable_add' %}is-active{% endif %}"
     role="tab">Timetables</a>
  <a href="{% url 'schedule_list' %}"
     class="tab {% if request.resolver_match.url_name == 'schedule_list' or request.resolver_match.url_name == 'schedule_add' %}is-active{% endif %}"
     role="tab">Schedules</a>
</div>
{% endpartialdef tabs_schedule %}
