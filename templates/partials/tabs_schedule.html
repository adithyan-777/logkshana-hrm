{% partialdef tabs_schedule inline %}
<div class="tabs" role="tablist" aria-label="Schedule sections">
  <a href="{% url 'timetable_list' %}"
     class="tab {% if request.resolver_match.url_name == 'timetable_list' or request.resolver_match.url_name == 'timetable_add' %}is-active{% endif %}"
     role="tab">Timetables</a>
  <a href="{% url 'shift_list' %}"
     class="tab {% if request.resolver_match.url_name == 'shift_list' or request.resolver_match.url_name == 'shift_add' %}is-active{% endif %}"
     role="tab">Shifts</a>
  <a href="{% url 'assignment_list' %}"
     class="tab {% if request.resolver_match.url_name == 'assignment_list' or request.resolver_match.url_name == 'assignment_add' %}is-active{% endif %}"
     role="tab">Assignments</a>
  <a href="{% url 'temporary_list' %}"
     class="tab {% if request.resolver_match.url_name == 'temporary_list' or request.resolver_match.url_name == 'temporary_add' %}is-active{% endif %}"
     role="tab">Temporary</a>
</div>
{% endpartialdef tabs_schedule %}
