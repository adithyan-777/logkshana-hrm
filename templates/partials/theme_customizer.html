<details class="theme-customizer">
  <summary class="btn-icon theme-customizer__trigger" aria-label="Theme customizer" title="Theme customizer">
    <i class="bx bx-palette admin-icon admin-icon--20"></i>
  </summary>
  <div class="theme-customizer__panel" role="dialog" aria-label="Theme Customizer">
    <div class="theme-customizer__head">
      <div class="theme-customizer__titles">
        <div class="theme-customizer__title">Theme Customizer</div>
        <p class="theme-customizer__subtitle">Customize your theme to your liking.</p>
      </div>
      <div class="theme-customizer__actions">
        <button type="button"
                class="btn-icon"
                data-ui-reset
                title="Reset to defaults"
                aria-label="Reset theme settings">
          <i class="bx bx-reset admin-icon admin-icon--18"></i>
        </button>
      </div>
    </div>

    <div class="theme-customizer__section">
      <div class="theme-customizer__label">Color Mode</div>
      <div class="seg" role="radiogroup" aria-label="Color mode">
        <button type="button" class="seg__btn" data-ui-set="mode" data-ui-value="light" role="radio">Light</button>
        <button type="button" class="seg__btn" data-ui-set="mode" data-ui-value="dark" role="radio">Dark</button>
        <button type="button" class="seg__btn" data-ui-set="mode" data-ui-value="system" role="radio">System</button>
      </div>
    </div>

    <div class="theme-customizer__section">
      <div class="theme-customizer__label">Content Layout</div>
      <div class="seg" role="radiogroup" aria-label="Content layout">
        <button type="button" class="seg__btn" data-ui-set="layout" data-ui-value="compact" role="radio">Compact</button>
        <button type="button" class="seg__btn" data-ui-set="layout" data-ui-value="full" role="radio">Full</button>
      </div>
    </div>

    <div class="theme-customizer__section">
      <div class="theme-customizer__label">Scale</div>
      <div class="seg" role="radiogroup" aria-label="UI scale">
        <button type="button" class="seg__btn" data-ui-set="scale" data-ui-value="sm" role="radio">SM</button>
        <button type="button" class="seg__btn" data-ui-set="scale" data-ui-value="md" role="radio">MD</button>
        <button type="button" class="seg__btn" data-ui-set="scale" data-ui-value="lg" role="radio">LG</button>
      </div>
    </div>

    <div class="theme-customizer__section">
      <div class="theme-customizer__label">Sidebar Variant</div>
      <div class="seg" role="radiogroup" aria-label="Sidebar variant">
        <button type="button" class="seg__btn" data-ui-set="sidebarVariant" data-ui-value="default" role="radio">Default</button>
        <button type="button" class="seg__btn" data-ui-set="sidebarVariant" data-ui-value="inset" role="radio">Inset</button>
      </div>
    </div>

    <div class="theme-customizer__section">
      <div class="theme-customizer__label">Sidebar Mode</div>
      <div class="seg" role="radiogroup" aria-label="Sidebar mode">
        <button type="button" class="seg__btn" data-ui-set="sidebarMode" data-ui-value="default" role="radio">Default</button>
        <button type="button" class="seg__btn" data-ui-set="sidebarMode" data-ui-value="icon" role="radio">Icon</button>
        <button type="button" class="seg__btn" data-ui-set="sidebarMode" data-ui-value="full" role="radio">Full</button>
      </div>
    </div>
  </div>
</details>
