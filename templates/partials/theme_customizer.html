{% partialdef theme_customizer inline %}
<div
  class="theme-customizer"
  :class="{ 'is-open': $store.ui.menu === 'theme' }"
  @click.outside="$store.ui.menu === 'theme' && $store.ui.closeMenus()"
>
  <button
    type="button"
    class="btn-icon theme-customizer__trigger"
    aria-label="Theme customizer"
    title="Theme customizer"
    aria-haspopup="dialog"
    :aria-expanded="$store.ui.menu === 'theme'"
    @click="$store.ui.toggleMenu('theme')"
  >
    <i class="bx bx-palette admin-icon admin-icon--20"></i>
  </button>
  <div class="theme-customizer__panel" role="dialog" aria-label="Theme Customizer" x-cloak>
    <div class="theme-customizer__head">
      <div class="theme-customizer__titles">
        <div class="theme-customizer__title">Theme Customizer</div>
        <p class="theme-customizer__subtitle">Customize your theme to your liking.</p>
      </div>
      <div class="theme-customizer__actions">
        <button type="button"
                class="btn-icon"
                title="Reset to defaults"
                aria-label="Reset theme settings"
                @click="$store.theme.reset()">
          <i class="bx bx-refresh-cw admin-icon admin-icon--18"></i>
        </button>
      </div>
    </div>

    <div class="theme-customizer__section">
      <div class="theme-customizer__label">Color Mode</div>
      <div class="seg" role="radiogroup" aria-label="Color mode">
        <button type="button" class="seg__btn" role="radio" @click="$store.theme.set('mode', 'light')" :class="{ 'is-active': $store.theme.prefs.mode === 'light' }" :aria-checked="$store.theme.prefs.mode === 'light'">Light</button>
        <button type="button" class="seg__btn" role="radio" @click="$store.theme.set('mode', 'dark')" :class="{ 'is-active': $store.theme.prefs.mode === 'dark' }" :aria-checked="$store.theme.prefs.mode === 'dark'">Dark</button>
        <button type="button" class="seg__btn" role="radio" @click="$store.theme.set('mode', 'system')" :class="{ 'is-active': $store.theme.prefs.mode === 'system' }" :aria-checked="$store.theme.prefs.mode === 'system'">System</button>
      </div>
    </div>

    <div class="theme-customizer__section">
      <div class="theme-customizer__label">Content Layout</div>
      <div class="seg" role="radiogroup" aria-label="Content layout">
        <button type="button" class="seg__btn" role="radio" @click="$store.theme.set('layout', 'compact')" :class="{ 'is-active': $store.theme.prefs.layout === 'compact' }" :aria-checked="$store.theme.prefs.layout === 'compact'">Compact</button>
        <button type="button" class="seg__btn" role="radio" @click="$store.theme.set('layout', 'full')" :class="{ 'is-active': $store.theme.prefs.layout === 'full' }" :aria-checked="$store.theme.prefs.layout === 'full'">Full</button>
      </div>
    </div>

    <div class="theme-customizer__section">
      <div class="theme-customizer__label">Scale</div>
      <div class="seg" role="radiogroup" aria-label="UI scale">
        <button type="button" class="seg__btn" role="radio" @click="$store.theme.set('scale', 'sm')" :class="{ 'is-active': $store.theme.prefs.scale === 'sm' }" :aria-checked="$store.theme.prefs.scale === 'sm'">SM</button>
        <button type="button" class="seg__btn" role="radio" @click="$store.theme.set('scale', 'md')" :class="{ 'is-active': $store.theme.prefs.scale === 'md' }" :aria-checked="$store.theme.prefs.scale === 'md'">MD</button>
        <button type="button" class="seg__btn" role="radio" @click="$store.theme.set('scale', 'lg')" :class="{ 'is-active': $store.theme.prefs.scale === 'lg' }" :aria-checked="$store.theme.prefs.scale === 'lg'">LG</button>
      </div>
    </div>

    <div class="theme-customizer__section">
      <div class="theme-customizer__label">Sidebar Variant</div>
      <div class="seg" role="radiogroup" aria-label="Sidebar variant">
        <button type="button" class="seg__btn" role="radio" @click="$store.theme.set('sidebarVariant', 'default')" :class="{ 'is-active': $store.theme.prefs.sidebarVariant === 'default' }" :aria-checked="$store.theme.prefs.sidebarVariant === 'default'">Default</button>
        <button type="button" class="seg__btn" role="radio" @click="$store.theme.set('sidebarVariant', 'inset')" :class="{ 'is-active': $store.theme.prefs.sidebarVariant === 'inset' }" :aria-checked="$store.theme.prefs.sidebarVariant === 'inset'">Inset</button>
      </div>
      <p class="theme-customizer__subtitle" style="margin-top: var(--space-2);">Also applies to the right drawer.</p>
    </div>

    <div class="theme-customizer__section">
      <div class="theme-customizer__label">Sidebar Mode</div>
      <div class="seg" role="radiogroup" aria-label="Sidebar mode">
        <button type="button" class="seg__btn" role="radio" @click="$store.theme.set('sidebarMode', 'default')" :class="{ 'is-active': $store.theme.prefs.sidebarMode === 'default' }" :aria-checked="$store.theme.prefs.sidebarMode === 'default'">Default</button>
        <button type="button" class="seg__btn" role="radio" @click="$store.theme.set('sidebarMode', 'icon')" :class="{ 'is-active': $store.theme.prefs.sidebarMode === 'icon' }" :aria-checked="$store.theme.prefs.sidebarMode === 'icon'">Icon</button>
        <button type="button" class="seg__btn" role="radio" @click="$store.theme.set('sidebarMode', 'full')" :class="{ 'is-active': $store.theme.prefs.sidebarMode === 'full' }" :aria-checked="$store.theme.prefs.sidebarMode === 'full'">Full</button>
      </div>
    </div>
  </div>
</div>
{% endpartialdef theme_customizer %}
