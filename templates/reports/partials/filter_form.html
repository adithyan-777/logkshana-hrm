{% partialdef filter_form inline %}
<form method="get" class="report-filters">
    <div class="report-filters__grid">
        {% for field in form %}
        <div class="form-field">
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <p class="form-error">{{ field.errors|join:", " }}</p>
            {% endif %}
        </div>
        {% endfor %}
    </div>
    {% if available_columns %}
    <input type="hidden" name="report_key" value="{{ report_key }}">
    <details class="report-columns">
        <summary class="form-label">Columns</summary>
        <div class="report-columns__grid">
            {% for column in available_columns %}
            <label class="report-columns__option">
                <input
                    type="checkbox"
                    name="fields"
                    value="{{ column.key }}"
                    {% if column in columns %}checked{% endif %}
                >
                {{ column.label }}
            </label>
            {% endfor %}
        </div>
        <button
            type="button"
            class="btn btn--ghost"
            hx-post="{% url 'report_save_columns' %}"
            hx-include="closest form"
        >
            Save as my default
        </button>
    </details>
    {% endif %}
    <div class="report-filters__actions">
        <button type="submit" class="btn btn--primary">
            <i class="bx bx-filter admin-icon admin-icon--18"></i>
            Apply filters
        </button>
        <a class="btn btn--ghost" href="{{ export_csv_url }}" hx-boost="false">
            <i class="bx bx-file admin-icon admin-icon--18"></i>
            CSV
        </a>
        <a class="btn btn--ghost" href="{{ export_xlsx_url }}" hx-boost="false">
            <i class="bx bx-table admin-icon admin-icon--18"></i>
            Excel
        </a>
        <a class="btn btn--ghost" href="{{ export_pdf_url }}" hx-boost="false">
            <i class="bx bx-file admin-icon admin-icon--18"></i>
            PDF
        </a>
    </div>
</form>
{% endpartialdef filter_form %}
