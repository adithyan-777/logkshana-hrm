<form method="get" class="report-filters">
    {% for field in form %}
    <div class="field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
        <p class="error">{{ field.errors|join:", " }}</p>
        {% endif %}
    </div>
    {% endfor %}
    <button type="submit">Apply filters</button>
</form>

<div class="export-buttons">
    <a href="{{ export_csv_url }}">Download CSV</a>
    <a href="{{ export_xlsx_url }}">Download Excel</a>
    <a href="{{ export_pdf_url }}">Download PDF</a>
</div>
