{% extends "base.html" %}

{% block title %}Timetables{% endblock %}

{% block content %}
{% include "schedule/partials/nav.html" %}

<h1>Timetables</h1>

<label for="timetable-search">Search</label>
<input
    id="timetable-search"
    class="search-input"
    type="search"
    name="q"
    value="{{ search }}"
    placeholder="Name or code..."
    hx-get="{% url 'timetable_list' %}"
    hx-target="#timetable-list"
    hx-trigger="keyup changed delay:300ms, search"
    hx-push-url="true"
>

<div
    id="timetable-list"
    hx-get="{% url 'timetable_list' %}{% if search %}?q={{ search|urlencode }}{% endif %}"
    hx-trigger="timetableCreated from:body"
    hx-swap="innerHTML"
>
    {% include "schedule/partials/timetable_table.html" %}
</div>

<p><a href="{% url 'timetable_add' %}">Add timetable</a></p>
{% endblock %}
