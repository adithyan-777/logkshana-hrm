{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ page_heading|default:"Sign In" }}{% endblock %} · Logkshana</title>
  <script>
    (function () {
      const storageKey = "logkshana-theme-mode";
      let mode = "system";
      try {
        mode = window.localStorage.getItem(storageKey) || "system";
      } catch (_) {}
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const resolvedTheme = mode === "dark" ? "dark" : mode === "light" ? "light" : prefersDark ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", resolvedTheme);
    })();
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5.2.5/index.min.css" rel="stylesheet">
  <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
  <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
  <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body class="standalone-page">
  <div class="standalone-shell">
    {% block content %}{% endblock %}
  </div>
  <script src="{% static 'js/theme.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
